services:
  db:
    image: postgres:16
    container_name: varsten-db
    environment:
      POSTGRES_USER: varsten
      POSTGRES_PASSWORD: varsten
      POSTGRES_DB: varsten
    ports:
      - "5434:5432"
    volumes:
      - varsten-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varsten -d varsten"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: varsten-api
    environment:
      # Inside the compose network the database is reachable at db:5432.
      DATABASE_URL: postgresql+psycopg://varsten:varsten@db:5432/varsten
      CORS_ORIGINS: '["http://localhost:3000"]'
      # Auth0 is optional locally; API-key reads work without it. Set these to
      # validate dashboard (session) auth.
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Local dev convenience only. Production frontend deploys to Vercel.
  # Reads frontend/.env.local (mounted) for Auth0 + NEXT_PUBLIC_API_BASE.
  frontend:
    image: node:22-slim
    container_name: varsten-frontend
    working_dir: /app
    # -H 0.0.0.0 so the dev server is reachable from the host through the port map.
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Anonymous volume keeps Linux-built node_modules out of the macOS host tree,
      # avoiding native-binary mismatches.
      - /app/node_modules
    depends_on:
      - api

volumes:
  varsten-db-data:
