<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Varsten — AI Spend Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;450;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   VARSTEN DESIGN SYSTEM
   ============================================================ */
:root {
  /* Accent — electric iris, used sparingly */
  --accent: #6A5CFF;
  --accent-press: #5A4DE6;
  --accent-soft: rgba(106, 92, 255, 0.14);
  --accent-line: rgba(106, 92, 255, 0.30);

  /* Semantic */
  --pos: #3DC98A;       /* savings / under budget / up-is-good */
  --pos-soft: rgba(61, 201, 138, 0.13);
  --neg: #F2585B;       /* overspend / over budget */
  --neg-soft: rgba(242, 88, 91, 0.13);
  --warn: #E2A33C;
  --warn-soft: rgba(226, 163, 60, 0.14);

  /* Categorical chart palette (desaturated, neutral-leaning) */
  --c1: #6A5CFF;
  --c2: #3FB6A8;
  --c3: #E2A33C;
  --c4: #5C8DEF;
  --c5: #C76FD0;
  --c6: #7C8794;

  --radius: 10px;
  --radius-sm: 7px;
  --radius-lg: 14px;
  --sidebar-w: 232px;
  --header-h: 56px;
  --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

/* ---------- DARK (primary) ---------- */
[data-theme="dark"] {
  --bg: #0A0B0D;
  --bg-grid: rgba(255,255,255,0.018);
  --surface: #111317;
  --surface-2: #16181D;
  --surface-hover: #1A1D23;
  --border: rgba(255,255,255,0.068);
  --border-strong: rgba(255,255,255,0.12);
  --text: #ECEDF0;
  --text-2: #A7ADB8;
  --text-3: #6A7180;
  --text-faint: #474D58;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.28);
  --chart-grid: rgba(255,255,255,0.055);
  --glow: rgba(106, 92, 255, 0.10);
}
/* ---------- LIGHT ---------- */
[data-theme="light"] {
  --bg: #FAFAFB;
  --bg-grid: rgba(0,0,0,0.016);
  --surface: #FFFFFF;
  --surface-2: #F7F7F9;
  --surface-hover: #F2F2F5;
  --border: rgba(15,18,30,0.085);
  --border-strong: rgba(15,18,30,0.14);
  --text: #15171C;
  --text-2: #565C68;
  --text-3: #8A909C;
  --text-faint: #B4B9C3;
  --shadow: 0 1px 2px rgba(15,18,30,0.06), 0 6px 20px rgba(15,18,30,0.06);
  --chart-grid: rgba(15,18,30,0.07);
  --glow: rgba(106, 92, 255, 0.07);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.011em;
  transition: background .4s var(--ease), color .4s var(--ease);
}
.mono { font-family: var(--font-mono); font-feature-settings: "tnum"; letter-spacing: -0.02em; }
.tnum { font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
::selection { background: var(--accent-soft); }

/* ============================================================
   APP SHELL
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  height: 100vh;
  background:
    radial-gradient(900px 480px at 12% -8%, var(--glow), transparent 60%),
    linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 100% 26px,
    var(--bg);
}

/* ---------- SIDEBAR ---------- */
.sidebar {
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  background: color-mix(in srgb, var(--surface) 50%, transparent);
  backdrop-filter: blur(8px);
  min-height: 0;
}
.brand {
  height: var(--header-h);
  display: flex; align-items: center; gap: 9px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
  background: linear-gradient(145deg, var(--accent), #8C7BFF);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 4px 12px rgba(106,92,255,0.35);
  display: grid; place-items: center;
  position: relative; overflow: hidden;
}
.brand-mark svg { width: 15px; height: 15px; }
.brand-name { font-weight: 600; font-size: 15px; letter-spacing: -0.03em; }
.brand-name b { color: var(--accent); font-weight: 600; }

.org-switcher {
  margin: 10px 12px 4px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  display: flex; align-items: center; gap: 9px; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.org-switcher:hover { background: var(--surface-hover); border-color: var(--border-strong); }
.org-avatar {
  width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
  background: linear-gradient(135deg, #2A2E37, #41454f);
  display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #cfd3da;
}
[data-theme="light"] .org-avatar { background: linear-gradient(135deg,#e6e7ea,#d3d5da); color:#3a3d44; }
.org-meta { min-width: 0; flex: 1; }
.org-meta .o1 { font-size: 12.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.org-meta .o2 { font-size: 11px; color: var(--text-3); }
.org-switcher .chev { color: var(--text-3); flex-shrink: 0; }

.nav { flex: 1; overflow-y: auto; padding: 8px 12px 16px; }
.nav-group-label {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--text-faint); padding: 14px 8px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 9px; border-radius: var(--radius-sm);
  color: var(--text-2); font-size: 13.5px; font-weight: 450;
  cursor: pointer; position: relative; user-select: none;
  transition: color .14s, background .14s;
}
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; stroke-width: 1.6; opacity: .85; }
.nav-item:hover { background: var(--surface-hover); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--text); font-weight: 500; }
.nav-item.active svg { color: var(--accent); opacity: 1; }
.nav-item.active::before {
  content: ""; position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 17px; background: var(--accent); border-radius: 0 3px 3px 0;
}
.nav-badge {
  margin-left: auto; font-size: 10.5px; font-weight: 600; padding: 1px 6px;
  border-radius: 20px; background: var(--accent); color: #fff;
}
.nav-badge.muted { background: var(--surface-2); color: var(--text-2); border:1px solid var(--border); }

.sidebar-foot { padding: 12px; border-top: 1px solid var(--border); }
.upgrade-card {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 11px 12px; background: linear-gradient(160deg, var(--accent-soft), transparent);
}
.upgrade-card .uc-t { font-size: 12.5px; font-weight: 600; }
.upgrade-card .uc-s { font-size: 11.5px; color: var(--text-2); margin: 3px 0 9px; line-height:1.4; }
.upgrade-card button {
  width: 100%; padding: 6px; font-size: 12px; font-weight: 550;
  border-radius: 6px; border: none; cursor: pointer;
  background: var(--accent); color: #fff; transition: background .15s;
}
.upgrade-card button:hover { background: var(--accent-press); }

/* ---------- MAIN COLUMN ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar {
  height: var(--header-h); flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px;
  padding: 0 20px;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(10px);
}
.crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-3); }
.crumb b { color: var(--text); font-weight: 550; }
.crumb .sep { color: var(--text-faint); }
.search {
  margin-left: 14px; flex: 1; max-width: 380px;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 11px; border: 1px solid var(--border); border-radius: 8px;
  color: var(--text-3); font-size: 13px; cursor: text;
  transition: border-color .15s, background .15s;
}
.search:hover { border-color: var(--border-strong); }
.search svg { width: 15px; height: 15px; }
.search .kbd {
  margin-left: auto; font-size: 11px; font-family: var(--font-mono);
  padding: 1px 6px; border: 1px solid var(--border); border-radius: 5px; color: var(--text-faint);
}
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 8px; border: 1px solid transparent; background: transparent;
  color: var(--text-2); cursor: pointer; position: relative;
  transition: background .15s, color .15s, border-color .15s;
}
.icon-btn:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border); }
.icon-btn svg { width: 17px; height: 17px; stroke-width: 1.7; }
.icon-btn .dot {
  position: absolute; top: 6px; right: 7px; width: 6px; height: 6px;
  background: var(--accent); border-radius: 50%; border: 1.5px solid var(--surface);
}
.avatar-btn {
  width: 30px; height: 30px; border-radius: 50%; margin-left: 4px; cursor: pointer;
  background: linear-gradient(135deg, #7a6bff, #c76fd0);
  display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border-strong);
}

/* ---------- CONTENT SCROLL ---------- */
.content { flex: 1; overflow-y: auto; min-height: 0; }
.view { display: none; padding: 26px 30px 60px; max-width: 1340px; margin: 0 auto; }
.view.active { display: block; animation: viewIn .45s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-title { font-size: 21px; font-weight: 600; letter-spacing: -0.025em; }
.page-sub { font-size: 13.5px; color: var(--text-2); margin-top: 3px; }
.page-head .spacer { flex: 1; }

/* Buttons / controls */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px; border-radius: 8px; font-size: 13px; font-weight: 500;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.btn:hover { background: var(--surface-hover); border-color: var(--border-strong); }
.btn svg { width: 15px; height: 15px; stroke-width: 1.8; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-press); border-color: var(--accent-press); }
.btn.ghost { background: transparent; }

.seg {
  display: inline-flex; padding: 3px; border: 1px solid var(--border);
  border-radius: 9px; background: var(--surface); gap: 2px;
}
.seg button {
  padding: 5px 12px; font-size: 12.5px; font-weight: 500; border: none;
  background: transparent; color: var(--text-2); border-radius: 6px; cursor: pointer;
  transition: all .15s; font-family: var(--font-sans);
}
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--surface-hover); color: var(--text); box-shadow: var(--shadow); }
[data-theme="dark"] .seg button.on { background: var(--surface-2); }

.daterange {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 11px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; color: var(--text-2); cursor: pointer; background: var(--surface);
  transition: border-color .15s;
}
.daterange:hover { border-color: var(--border-strong); }
.daterange svg { width: 15px; height: 15px; }

/* ============================================================
   CARDS / GRID
   ============================================================ */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); position: relative;
}
.card-pad { padding: 18px 20px; }
.card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 15px 20px; border-bottom: 1px solid var(--border);
}
.card-head h3 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.card-head .sub { font-size: 12px; color: var(--text-3); }
.card-head .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.grid { display: grid; gap: 16px; }
.kpi-row { grid-template-columns: repeat(5, 1fr); margin-bottom: 16px; }
.cols-2 { grid-template-columns: 1.62fr 1fr; }
.cols-3 { grid-template-columns: repeat(3, 1fr); }
.cols-4 { grid-template-columns: repeat(4, 1fr); }

/* KPI */
.kpi { padding: 15px 16px; }
.kpi .label { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.kpi .label svg { width: 14px; height: 14px; color: var(--text-3); }
.kpi .value { font-size: 27px; font-weight: 600; letter-spacing: -0.04em; margin-top: 10px; line-height: 1; }
.kpi .value .cur { font-size: 17px; color: var(--text-3); font-weight: 500; margin-right: 1px; }
.kpi .foot { display: flex; align-items: center; gap: 8px; margin-top: 11px; font-size: 12px; }
.kpi .spark { margin-top: 12px; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 550; font-size: 12px; }
.delta svg { width: 13px; height: 13px; }
.delta.up { color: var(--pos); } .delta.down { color: var(--neg); } .delta.flat { color: var(--text-3); }
.delta.bad-up { color: var(--neg); } .delta.good-down { color: var(--pos); }
.kpi .foot .cmp { color: var(--text-3); }

/* Pills / badges */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 550; padding: 2px 9px; border-radius: 20px;
  border: 1px solid var(--border);
}
.pill .dotp { width: 6px; height: 6px; border-radius: 50%; }
.pill.green { color: var(--pos); border-color: color-mix(in srgb, var(--pos) 30%, transparent); background: var(--pos-soft); }
.pill.red { color: var(--neg); border-color: color-mix(in srgb, var(--neg) 30%, transparent); background: var(--neg-soft); }
.pill.amber { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); background: var(--warn-soft); }
.pill.accent { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.pill.neutral { color: var(--text-2); background: var(--surface-2); }

/* ============================================================
   TABLES
   ============================================================ */
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--text-3); padding: 9px 20px; white-space: nowrap;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
.tbl th.r, .tbl td.r { text-align: right; }
.tbl td {
  padding: 11px 20px; font-size: 13px; border-bottom: 1px solid var(--border);
  color: var(--text); vertical-align: middle;
}
.tbl tr:last-child td { border-bottom: none; }
.tbl tbody tr { transition: background .12s; }
.tbl tbody tr:hover { background: var(--surface-hover); }
.tbl .muted { color: var(--text-2); }
.tbl .name { font-weight: 500; display: flex; align-items: center; gap: 9px; }
.bar-mini { height: 5px; border-radius: 4px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
.bar-mini > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }

.dot-ic { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.logo-chip {
  width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 10px; font-weight: 700;
  font-family: var(--font-mono); color: #fff;
}

/* ============================================================
   CHARTS
   ============================================================ */
.chart-wrap { padding: 8px 14px 14px; }
svg.chart { width: 100%; display: block; overflow: visible; }
.chart .gridline { stroke: var(--chart-grid); stroke-width: 1; }
.chart .axis-lbl { fill: var(--text-3); font-size: 10.5px; font-family: var(--font-mono); }
.chart .area-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chart .cmp-line { fill: none; stroke: var(--text-faint); stroke-width: 1.5; stroke-dasharray: 3 4; }
.draw-line { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.1s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.area-fill { animation: fadeUp .9s var(--ease) .25s both; transform-origin: bottom; }
@keyframes fadeUp { from { opacity: 0; } to { opacity: 1; } }
.bar-rect { transition: opacity .15s; }
.bar-rect:hover { opacity: .82; }
.grow-bar { animation: growB .8s var(--ease) forwards; transform-box: fill-box; transform-origin: bottom; }
@keyframes growB { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.donut-seg { transition: opacity .15s; }
.donut-seg:hover { opacity: .82; }

/* H-bar list */
.hbar-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
.hbar-row + .hbar-row { border-top: 1px solid var(--border); }
.hbar-row .hl { display: flex; align-items: center; gap: 8px; width: 150px; flex-shrink: 0; font-size: 13px; }
.hbar-track { flex: 1; height: 8px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.hbar-track > i { display: block; height: 100%; border-radius: 5px; animation: growW 1s var(--ease) forwards; }
@keyframes growW { from { width: 0 !important; } }
.hbar-row .hv { width: 92px; text-align: right; font-size: 13px; }
.hbar-row .hp { width: 44px; text-align: right; font-size: 12px; color: var(--text-3); }

/* Legend */
.legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 4px 20px 14px; }
.legend .li { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.legend .sw { width: 9px; height: 9px; border-radius: 3px; }

/* Donut center */
.donut-box { position: relative; display: grid; place-items: center; }
.donut-center { position: absolute; text-align: center; }
.donut-center .dc-v { font-size: 21px; font-weight: 600; letter-spacing: -0.03em; }
.donut-center .dc-l { font-size: 11px; color: var(--text-3); }

/* ============================================================
   INSIGHTS / RECOMMENDATIONS
   ============================================================ */
.insight {
  display: flex; gap: 13px; padding: 15px 18px;
  border-bottom: 1px solid var(--border); transition: background .14s;
}
.insight:last-child { border-bottom: none; }
.insight:hover { background: var(--surface-hover); }
.insight-ic {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
}
.insight-ic svg { width: 16px; height: 16px; }
.insight-body { flex: 1; min-width: 0; }
.insight-body .it { font-size: 13.5px; font-weight: 500; line-height: 1.4; }
.insight-body .it b { color: var(--accent); font-weight: 600; }
.insight-body .id { font-size: 12.5px; color: var(--text-2); margin-top: 3px; }
.insight-save { text-align: right; flex-shrink: 0; }
.insight-save .sv { font-size: 14px; font-weight: 600; color: var(--pos); font-family: var(--font-mono); }
.insight-save .sl { font-size: 10.5px; color: var(--text-3); }

/* Recommendation cards */
.rec-card { padding: 0; overflow: hidden; }
.rec-top { padding: 16px 18px; display: flex; gap: 14px; }
.rec-ic {
  width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center;
}
.rec-ic svg { width: 19px; height: 19px; }
.rec-main { flex: 1; min-width: 0; }
.rec-tags { display: flex; gap: 7px; margin-bottom: 7px; flex-wrap: wrap; }
.rec-title { font-size: 15px; font-weight: 600; letter-spacing: -0.015em; }
.rec-desc { font-size: 13px; color: var(--text-2); margin-top: 5px; line-height: 1.5; }
.rec-metrics {
  display: flex; gap: 26px; padding: 13px 18px;
  border-top: 1px solid var(--border); background: var(--surface-2);
}
.rec-metric .rm-l { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
.rec-metric .rm-v { font-size: 15px; font-weight: 600; margin-top: 3px; font-family: var(--font-mono); }
.rec-metric .rm-v.green { color: var(--pos); }
.rec-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.conf-bar { display: flex; gap: 3px; align-items: center; }
.conf-bar i { width: 14px; height: 5px; border-radius: 2px; background: var(--border-strong); }
.conf-bar i.on { background: var(--pos); }

/* Confidence note */
.why {
  font-size: 12px; color: var(--text-3); padding: 11px 18px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: flex-start;
}
.why svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }

/* ============================================================
   FILTER BAR (cost explorer)
   ============================================================ */
.filterbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-lg);
  background: var(--surface); margin-bottom: 16px;
}
.fchip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 11px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 12.5px; color: var(--text-2); cursor: pointer; background: var(--surface-2);
  transition: all .14s;
}
.fchip:hover { border-color: var(--border-strong); color: var(--text); }
.fchip svg { width: 13px; height: 13px; opacity: .7; }
.fchip b { color: var(--text); font-weight: 550; }
.fchip.add { border-style: dashed; color: var(--text-3); background: transparent; }
.filterbar .vline { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }

/* Budget progress */
.budget-prog { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; position: relative; }
.budget-prog > i { display: block; height: 100%; border-radius: 6px; animation: growW 1s var(--ease) forwards; }
.budget-prog .marker { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-2); }

/* code block */
.code {
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; overflow-x: auto; color: var(--text-2);
}
.code .k { color: var(--accent); } .code .s { color: var(--pos); } .code .c { color: var(--text-faint); }
.code .p { color: var(--c3); }

/* misc */
.row-actions { display: flex; gap: 6px; justify-content: flex-end; }
.lastact { color: var(--text-3); font-size: 12.5px; }
.empty-hint { font-size:12.5px; color: var(--text-3); }
.section-gap { margin-top: 16px; }
@media (max-width: 1100px) {
  .kpi-row { grid-template-columns: repeat(3,1fr); }
  .cols-2, .cols-3, .cols-4 { grid-template-columns: 1fr 1fr; }
}

/* ============================================================

   ============================================================ */
function lineChart(d, {h=240, fmt=usd, showCmp=true}={}){
  const W=1000, pad={t:14,r:14,b:26,l:54};
  const all=[...d.points, ...(showCmp?d.cmp:[])];
  const max=Math.max(...all)*1.08, min=Math.min(...all)*0.82;
  const plotW=W-pad.l-pad.r, plotH=h-pad.t-pad.b;
  const x=i=>pad.l + (i/(d.points.length-1))*plotW;
  const y=v=>pad.t + (1-(v-min)/(max-min))*plotH;
  const path=arr=>arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const line=path(d.points);
  const area=`${line} L${x(d.points.length-1)} ${pad.t+plotH} L${pad.l} ${pad.t+plotH} Z`;
  // gridlines + y labels
  let grid='', ylab='';
  for(let g=0; g<=4; g++){ const v=min+(max-min)*g/4; const yy=y(v);
    grid+=`<line class="gridline" x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}"/>`;
    ylab+=`<text class="axis-lbl" x="${pad.l-9}" y="${yy+3}" text-anchor="end">${fmt(v).replace(/\.0$/,'')}</text>`;
  }
  // x labels (subset)
  let xlab=''; const step=Math.ceil(d.labels.length/8);
  d.labels.forEach((l,i)=>{ if(i%step===0||i===d.labels.length-1) xlab+=`<text class="axis-lbl" x="${x(i)}" y="${h-7}" text-anchor="middle">${l}</text>`; });
  const len=2600;
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${ylab}${xlab}
    <path class="area-fill" d="${area}" fill="url(#ag)"/>
    ${showCmp?`<path class="cmp-line" d="${path(d.cmp)}"/>`:''}
    <path class="area-line draw-line" style="--len:${len}" stroke-dasharray="${len}" d="${line}"/>
    <circle cx="${x(d.points.length-1)}" cy="${y(d.points.at(-1))}" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
  </svg></div>`;
}

function stackedCols(labels, series){ // series: [{name,color,data:[]}]
  const W=1000,h=260,pad={t:14,r:10,b:26,l:54};
  const totals=labels.map((_,i)=>series.reduce((s,se)=>s+se.data[i],0));
  const max=Math.max(...totals)*1.1;
  const plotW=W-pad.l-pad.r, plotH=h-pad.t-pad.b;
  const bw=plotW/labels.length*0.56;
  const x=i=>pad.l+(i+0.5)/labels.length*plotW;
  const yv=v=>(v/max)*plotH;
  let grid='',ylab='';
  for(let g=0;g<=4;g++){const v=max*g/4;const yy=pad.t+plotH-yv(v);
    grid+=`<line class="gridline" x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}"/>`;
    ylab+=`<text class="axis-lbl" x="${pad.l-9}" y="${yy+3}" text-anchor="end">${usd(v)}</text>`;}
  let bars='',xlab='';
  labels.forEach((l,i)=>{ let acc=0;
    series.forEach((se,si)=>{ const hh=yv(se.data[i]); const yy=pad.t+plotH-acc-hh; acc+=hh;
      bars+=`<rect class="bar-rect grow-bar" style="animation-delay:${i*0.03}s" x="${x(i)-bw/2}" y="${yy}" width="${bw}" height="${Math.max(0,hh)}" rx="2" fill="${se.color}"/>`;});
    xlab+=`<text class="axis-lbl" x="${x(i)}" y="${h-7}" text-anchor="middle">${l}</text>`;});
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${h}">${grid}${ylab}${bars}${xlab}</svg></div>`;
}

function donut(segs, {size=180, label='Total', total}={}){ // segs:[{name,value,color}]
  const sum=segs.reduce((s,x)=>s+x.value,0);
  const R=size/2, r=R*0.66, cx=R, cy=R, C=2*Math.PI*((R+r)/2);
  let off=0, ring='';
  const sw=R-r;
  segs.forEach((s,i)=>{ const frac=s.value/sum; const dash=frac*C;
    ring+=`<circle class="donut-seg" cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"><title>${s.name}: ${pct(frac*100)}</title></circle>`;
    off+=dash;});
  return `<div class="donut-box" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(0)">${ring}</svg>
    <div class="donut-center"><div class="dc-v">${total||usd(sum)}</div><div class="dc-l">${label}</div></div></div>`;
}

function hbars(items, {fmt=usd, max}={}){ // items:[{name,value,share,color,dot}]
  const mx=max||Math.max(...items.map(i=>i.value));
  return items.map(it=>`<div class="hbar-row">
    <div class="hl">${it.dot?`<span class="dot-ic" style="background:${it.color||'var(--accent)'}"></span>`:''}${it.name}</div>
    <div class="hbar-track"><i style="width:${(it.value/mx*100).toFixed(1)}%;background:${it.color||'var(--accent)'}"></i></div>
    <div class="hv mono tnum">${fmt(it.value)}</div>
    <div class="hp mono tnum">${it.share!=null?pct(it.share):''}</div>
  </div>`).join('');
}

function spark(arr, {w=120,h=30,color='var(--text-3)'}={}){
  const max=Math.max(...arr),min=Math.min(...arr);
  const x=i=>i/(arr.length-1)*w, y=v=>h-2-((v-min)/(max-min||1))*(h-4);
  const p=arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" style="overflow:visible"><path d="${p}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round"/></svg>`;
}

function delta(v, goodIsDown=false){

    ${alertRow('green','Support team is pacing 13% under budget','Informational · 1 week ago','check')}
  </div>`;
function budgetRow(b){
  const p=Math.min(100, b.spent/b.limit*100);
  const fcP=Math.min(118, b.fc/b.limit*100);
  const c = b.status==='over'?'var(--neg)':(b.status==='warn'?'var(--warn)':'var(--pos)');
  const st = b.status==='over'?'red':(b.status==='warn'?'amber':'green');
  const stl= b.status==='over'?'Over budget':(b.status==='warn'?'Near limit':'On track');
  return `<div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:10px"><span style="font-weight:550;font-size:13.5px">${b.name}</span><span class="pill ${st}"><span class="dotp" style="background:${c}"></span>${stl}</span></div>
      <div class="mono tnum" style="font-size:13px"><span style="color:var(--text)">${usd(b.spent)}</span><span style="color:var(--text-3)"> / ${usd(b.limit)}</span></div>
    </div>
    <div class="budget-prog"><i style="width:${p}%;background:${c}"></i><span class="marker" style="left:${Math.min(100,fcP)}%" title="forecast"></span></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px"><span class="empty-hint">${pct(p)} used</span><span class="empty-hint">forecast ${usd(b.fc)} (${pct(fcP)})</span></div>
  </div>`;
}
function alertRow(tone,t,s,icon){
  const c=tone==='red'?'var(--neg)':(tone==='amber'?'var(--warn)':'var(--pos)');
  const bg=tone==='red'?'var(--neg-soft)':(tone==='amber'?'var(--warn-soft)':'var(--pos-soft)');
  return `<div class="insight"><div class="insight-ic" style="background:${bg};color:${c}">${ic(icon)}</div><div class="insight-body"><div class="it">${t}</div><div class="id">${s}</div></div></div>`;
}

const NAV = [
  {g:'Analyze', items:[
    {id:'overview', label:'Overview', icon:'overview'},
    {id:'explorer', label:'Cost Explorer', icon:'explorer'},
    {id:'usage', label:'Usage Analytics', icon:'usage'}
  ]},
  {g:'Optimize', items:[
    {id:'recommendations', label:'Recommendations', icon:'recs', badge:'7'},
    {id:'budgets', label:'Budgets & Alerts', icon:'budgets', badgeMuted:'1'}
  ]},
  {g:'Catalog', items:[
    {id:'models', label:'Models', icon:'models'},
    {id:'providers', label:'Providers', icon:'providers'}
  ]},
  {g:'Settings', items:[
    {id:'keys', label:'API Keys', icon:'keys'},
    {id:'team', label:'Team', icon:'team'},
    {id:'settings', label:'Settings', icon:'settings'}
  ]}
];
const LABELS = {};
function buildNav(){
  document.getElementById('nav').innerHTML = NAV.map(grp=>`
    <div class="nav-group-label">${grp.g}</div>
    ${grp.items.map(it=>{LABELS[it.id]=it.label;return `<div class="nav-item" data-id="${it.id}" onclick="go('${it.id}')">${ic(it.icon)}<span>${it.label}</span>${it.badge?`<span class="nav-badge">${it.badge}</span>`:''}${it.badgeMuted?`<span class="nav-badge muted">${it.badgeMuted}</span>`:''}</div>`;}).join('')}
  `).join('');
}
let current='overview';
function go(id){
  current=id;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.id===id));
  document.getElementById('crumb').textContent = LABELS[id]||id;
  const c=document.getElementById('content');
  c.innerHTML = `<div class="view active">${VIEWS[id]()}</div>`;
  c.scrollTop=0;
  wireView(id);
}

/* per-view interactivity */
function wireView(id){
  if(id==='overview'){
    const seg=document.getElementById('granSeg');
    seg && seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
      document.getElementById('spendChart').innerHTML=lineChart(SPEND[b.dataset.g], {fmt: b.dataset.g==='day'?(v=>usd(v)):usd});
    });
  }
  if(id==='explorer'){
    const seg=document.getElementById('groupSeg');
    seg && seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      groupBy=b.dataset.gb; go('explorer');
    });
  }
}
function applyRec(i){const el=document.getElementById('rec-'+i);const btn=el.querySelectorAll('.btn.primary')[0];btn.outerHTML=`<span class="pill green" style="padding:7px 13px">${ic('check',2.2)} ${RECS[i].risk?'Alert set':'Applied'}</span>`;el.style.opacity=.7;}
function dismissRec(i){const el=document.getElementById('rec-'+i);el.style.transition='opacity .3s, transform .3s';el.style.opacity=0;el.style.transform='translateX(20px)';setTimeout(()=>el.style.display='none',300);}

/* theme */
function toggleTheme(){
  const h=document.documentElement;
  const dark = h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme', dark?'light':'dark');
  document.getElementById('themeIcon').innerHTML = dark
    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2 M12 20v2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M2 12h2 M20 12h2 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
  // re-render charts so colors pick up theme vars cleanly
  go(current);
}

/* init */
buildNav();
go('overview');
