name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: varsten
          POSTGRES_PASSWORD: varsten
          POSTGRES_DB: varsten
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U varsten -d varsten"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://varsten:varsten@localhost:5432/varsten
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      # Static gates run first so a formatting/type/security/complexity regression
      # fails fast, before the slower DB-backed test run.
      - name: Lint (ruff check + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck (mypy)
        run: uv run mypy app scripts tests
      - name: Security scan (bandit)
        run: uv run bandit -q -c pyproject.toml -r app scripts
      - name: Complexity budget
        run: |
          uv run radon cc app scripts -s -nb
          uv run python -m scripts.check_complexity
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov=scripts
      - name: Engine validation proof pack (fast)
        run: uv run python scripts/validate_engine.py --suite fast --report-dir validation_reports/fast
      - name: Upload engine validation proof pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-validation-proof-pack-fast
          path: backend/validation_reports/fast
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # Placeholder values: the build only needs these to exist, not to be real.
    env:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      AUTH0_DOMAIN: example.us.auth0.com
      AUTH0_CLIENT_ID: ci-client-id
      AUTH0_CLIENT_SECRET: ci-client-secret
      AUTH0_SECRET: ci-placeholder-secret-not-used-at-build-time-0000
      AUTH0_AUDIENCE: https://api.varsten.local
      APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  marketing:
    name: Marketing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  sdk:
    name: SDK (fail-open wrappers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  docker:
    name: Docker build (API image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t varsten-api:ci ./backend
