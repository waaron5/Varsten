document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

count=\"19\">\n                        <div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%;\">\n                          <div style=\"{{ b.stackStyle }}\">\n                            <div style=\"{{ b.savedStyle }}\"><\u002Fdiv>\n                            <div style=\"{{ b.actualStyle }}\"><\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex: 1 1 250px; min-width: 230px; background: #fff; border-radius: 12px; border: 1px solid #ece8e1; overflow: hidden;\">\n                <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 15px 18px 14px; border-bottom: 1px solid #ece8e1;\">\n                  <span style=\"font: 700 14px/1 'DM Sans', sans-serif; color: #1a1714;\">Savings by lever<\u002Fspan>\n                  <span style=\"font: 600 9.5px/1 'DM Sans', sans-serif; color: #0e9e6e; background: rgba(14,158,110,0.1); padding: 4px 8px; border-radius: 100px;\">{{ leverActive }} active<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ levers }}\" as=\"l\" hint-placeholder-count=\"5\">\n                  <div style=\"padding: 11px 18px 10px; border-bottom: 1px solid #f6f3ee;\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;\">\n                      <span style=\"font: 600 12.5px/1.2 'DM Sans', sans-serif; color: {{ l.nameColor }};\">{{ l.name }}<\u002Fspan>\n                      <span style=\"font: 700 14px/1 'DM Sans', sans-serif; color: {{ l.amountColor }}; font-variant-numeric: tabular-nums;\">{{ l.amount }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"height: 5px; background: #f2efe9; border-radius: 3px; overflow: hidden;\">\n                      <div style=\"{{ l.barStyle }}\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ PROBLEM ══════════ -->\n  <section data-screen-label=\"Problem\" data-speaker-notes=\"AI spend is now COGS\" style=\"scroll-margin-top: 80px; background: #efebe2; border-top: 1px solid #e7e2d9; border-bottom: 1px solid #e7e2d9; padding: clamp(56px, 7vw, 96px) clamp(20px, 5vw, 48px);\">\n    <div style=\"max-width: 1080px; margin: 0 auto;\">\n      <div style=\"font: 700 11px/1 'Space Mono', monospace; letter-spacing: 0.16em; text-transform: uppercase; color: #b08a5a; margin-bottom: 18px;\">The problem<\u002Fdiv>\n      <h2 style=\"font: 700 clamp(28px, 4vw, 42px)/1.12 'DM Sans', sans-serif; letter-spacing: -0.025em; color: #1a1714; max-width: 760px; margin-bottom: 18px; text-wrap: balance;\">When AI becomes cost of goods sold, every token shows up in your margin.<\u002Fh2>\n      <p style=\"font: 400 clamp(15px, 1.5vw, 17px)/1.62 'DM Sans', sans-serif; color: #6f6a63; max-width: 620px; margin-bottom: 44px; text-wrap: pretty;\">LLM and API spend used to be a line item you could ignore. Now it scales with usage, lands in your gross margin, and shows up in board decks. The hard part isn't knowing the bill is high. It's that you can't see <em style=\"font-style: normal; color: #1a1714; font-weight: 600;\">where<\u002Fem> the money goes, you can't cut it without risking quality, and you can't prove the savings even when you do.<\u002Fp>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(248px, 1fr)); gap: 14px; margin-bottom: 40px;\">\n        <sc-for list=\"{{ problems }}\" as=\"q\" hint-placeholder-count=\"4\">\n          <div style=\"background: #fff; border: 1px solid #ece8e1; border-radius: 12px; padding: 22px 22px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.04);\">\n            <div style=\"font: 700 12px/1 'Space Mono', monospace; color: #d6cfc1; margin-bottom: 16px;\">{{ q.num }}<\u002Fdiv>\n            <p style=\"font: 500 15px/1.45 'DM Sans', sans-serif; color: #2a2620; text-wrap: pretty;\">{{ q.text }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; align-items: center; gap: 16px; background: #1a1714; border-radius: 12px; padding: 22px 26px;\">\n        <span style=\"width: 4px; align-self: stretch; background: #0e9e6e; border-radius: 100px; flex: none;\"><\u002Fspan>\n        <p style=\"font: 500 clamp(15px, 1.6vw, 18px)/1.5 'DM Sans', sans-serif; color: #faf8f3; text-wrap: pretty;\">Most teams answer these with spreadsheets, gut feel, and a quarterly scramble. <span style=\"color: #5fd3a6;\">That's not a strategy. It's exposure.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ SOLUTION ══════════ -->\n  <section id=\"solution\" data-screen-label=\"Solution\" data-speaker-notes=\"Observe, Optimize, Prove\" style=\"scroll-margin-top: 64px; background: #1a1714; padding: clamp(60px, 7vw, 104px) clamp(20px, 5vw, 48px);\">\n    <div style=\"max-width: 1120px; margin: 0 auto;\">\n      <div style=\"text-align: center; margin-bottom: 52px;\">\n        <div style=\"font: 700 11px/1 'Space Mono', monospace; letter-spacing: 0.16em; text-transform: uppercase; color: #0e9e6e; margin-bottom: 18px;\">The solution<\u002Fdiv>\n        <h2 style=\"font: 700 clamp(30px, 4.4vw, 46px)/1.08 'DM Sans', sans-serif; letter-spacing: -0.03em; color: #faf8f3; margin-bottom: 18px;\">Observe. Optimize. Prove.<\u002Fh2>\n        <p style=\"font: 400 clamp(15px, 1.5vw, 17px)/1.6 'DM Sans', sans-serif; color: rgba(250,248,243,0.55); max-width: 600px; margin: 0 auto; text-wrap: pretty;\">Varsten sits inline between your application and your AI providers. It does three things, in order, and it does them without asking you to trust it blindly.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px;\">\n        <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"background: #211d19; border: 1px solid rgba(250,248,243,0.09); border-radius: 14px; padding: 30px 28px 32px;\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;\">\n              <span style=\"font: 700 13px/1 'Space Mono', monospace; color: #0e9e6e;\">{{ p.num }}<\u002Fspan>\n              <span style=\"font: 600 10px/1 'Space Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(250,248,243,0.32);\">{{ p.tag }}<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"font: 700 23px/1.1 'DM Sans', sans-serif; letter-spacing: -0.02em; color: #faf8f3; margin-bottom: 12px;\">{{ p.title }}<\u002Fh3>\n            <p style=\"font: 400 14.5px/1.6 'DM Sans', sans-serif; color: rgba(250,248,243,0.55); text-wrap: pretty;\">{{ p.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ PRODUCT PREVIEW ══════════ -->\n  <section id=\"product\" data-screen-label=\"Product Preview\" data-speaker-notes=\"Savings overview + spend drivers\" style=\"scroll-margin-top: 80px; padding: clamp(60px, 7vw, 104px) clamp(20px, 5vw, 48px);\">\n    <div style=\"max-width: 1200px; margin: 0 auto;\">\n      <div style=\"max-width: 720px; margin-bottom: 44px;\">\n        <div style=\"font: 700 11px/1 'Space Mono', monospace; letter-spacing: 0.16em; text-transform: uppercase; color: #0b8059; margin-bottom: 18px;\">Inside the product<\u002Fdiv>\n        <h2 style=\"font: 700 clamp(28px, 4vw, 42px)/1.1 'DM Sans', sans-serif; letter-spacing: -0.025em; color: #1a1714; margin-bottom: 16px; text-wrap: balance;\">The finance view and the engineering view, in one place.<\u002Fh2>\n        <p style=\"font: 400 clamp(15px, 1.5vw, 17px)/1.6 'DM Sans', sans-serif; color: #6f6a63; text-wrap: pretty;\">Every dollar is broken down the way finance actually thinks about cost: by model, route, feature, team, and pricing source. No estimating. The full picture.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch;\">\n\n        <!-- savings chart -->\n        <div style=\"flex: 1 1 520px; min-width: 300px; background: #fff; border-radius: 14px; border: 1px solid #ece8e1; box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 8px 28px rgba(0,0,0,.04); overflow: hidden; display: flex; flex-direction: column;\">\n          <div style=\"display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 24px 4px; flex-wrap: wrap; gap: 12px;\">\n            <div>\n              <div style=\"font: 700 16px/1.2 'DM Sans', sans-serif; color: #1a1714; margin-bottom: 3px;\">Savings<\u002Fdiv>\n              <div style=\"font: 400 12.5px/1 'DM Sans', sans-serif; color: #a8a29e;\">Daily. Each bar is what you'd have paid, split into spend &amp; savings<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 16px;\">\n              <span style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 9px; height: 9px; border-radius: 2px; background: #d6cfc1;\"><\u002Fspan><span style=\"font: 400 12px/1 'DM Sans', sans-serif; color: #8a847c;\">Actual spend<\u002Fspan><\u002Fspan>\n              <span style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 9px; height: 9px; border-radius: 2px; background: #0e9e6e;\"><\u002Fspan><span style=\"font: 400 12px/1 'DM Sans', sans-serif; color: #8a847c;\">Savings<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 18px 24px 6px; flex: 1;\">\n            <div style=\"position: relative; height: 230px; margin-left: 42px;\">\n              <sc-for list=\"{{ yTicks }}\" as=\"g\" hint-placeholder-count=\"6\">\n                <div style=\"{{ g.lineStyle }}\"><\u002Fdiv>\n                <div style=\"{{ g.labelStyle }}\">{{ g.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 4px;\">\n                <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"19\">\n                  <div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%;\">\n                    <div style=\"{{ b.stackStyle }}\">\n                      <div style=\"{{ b.savedStyle }}\"><\u002Fdiv>\n                      <div style=\"{{ b.actualStyle }}\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 4px; margin-left: 42px; margin-top: 8px;\">\n              <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"19\">\n                <div style=\"flex: 1; text-align: center; font: 400 10px/1 'Space Mono', monospace; color: #c0bcb6;\">{{ b.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid #f0ede7;\">\n            <div style=\"padding: 16px 20px;\">\n              <div style=\"font: 600 9.5px/1 'Space Mono', monospace; letter-spacing: 0.07em; text-transform: uppercase; color: #b0a9a2; margin-bottom: 7px;\">Avg daily spend<\u002Fdiv>\n              <div style=\"font: 700 19px/1 'DM Sans', sans-serif; color: #1a1714; font-variant-numeric: tabular-nums;\">{{ avgSpend }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 16px 20px; border-left: 1px solid #f0ede7;\">\n              <div style=\"font: 600 9.5p nt: 11200, active: true },\n    { name: 'Batching',       amount: 3300,  active: true },\n    { name: 'Token trim',     amount: 2270,  active: true },\n    { name: 'Smart routing',  amount: 0,     active: false },\n  ];\n\n  driverDefs = [\n    { name: 'Engineering',  spend: 18300 },\n    { name: 'Product',      spend: 9800  },\n    { name: 'Data Science', spend: 6400  },\n    { name: 'Marketing',    spend: 4200  },\n    { name: 'Support',      spend: 2510  },\n    { name: 'Untagged',     spend: 1400, muted: true },\n  ];\n\n  RAMP = ['#2e2420', '#5c4d45', '#857569', '#a89c93', '#cabfb6'];\n  MUTED = '#e0d7ce';\n\n  fmt(n) { return '$' + Math.round(n).toLocaleString('en-US'); }\n\n  renderVals() {\n    const sum = a => a.reduce((s, x) => s + x, 0);\n    const fmt = n => this.fmt(n);\n    const green = '#0e9e6e';\n\n    const actualSpend = sum(this.daily.actual);\n    const grossSaved  = sum(this.daily.saved);\n    const counterfactual = actualSpend + grossSaved;\n    const fee = grossSaved * 0.25;\n    const net = grossSaved - fee;\n    const effRate = grossSaved / counterfactual * 100;\n    const days = this.daily.actual.length;\n\n    // ── hero mini bars ──\n    const heroMax = 5000;\n    const heroBars = this.daily.actual.map((a, i) => {\n      const s = this.daily.saved[i];\n      const total = a + s;\n      return {\n        stackStyle: { width: '100%', height: (total / heroMax * 100) + '%', display: 'flex', flexDirection: 'column', borderRadius: '2px 2px 0 0', overflow: 'hidden' },\n        savedStyle: { height: (s / total * 100) + '%', background: '#0e9e6e' },\n        actualStyle: { height: (a / total * 100) + '%', background: '#d6cfc1' },\n      };\n    });\n\n    // ── product chart ──\n    const maxY = 5000;\n    const yTicks = [0,1000,2000,3000,4000,5000].map(v => ({\n      label: '$' + (v/1000) + 'K',\n      lineStyle: { position: 'absolute', left: 0, right: 0, bottom: (v/maxY*100) + '%', borderTop: v === 0 ? '1px solid #e3ddd2' : '1px dashed #efebe3', height: 0 },\n      labelStyle: { position: 'absolute', left: '-42px', bottom: 'calc(' + (v/maxY*100) + '% - 6px)', width: '34px', textAlign: 'right', font: \"400 10px/1 'Space Mono', monospace\", color: '#c0bcb6' },\n    }));\n    const showLabelDays = new Set([1,5,10,15,days]);\n    const bars = this.daily.actual.map((a, i) => {\n      const s = this.daily.saved[i];\n      const total = a + s;\n      return {\n        label: showLabelDays.has(i+1) ? String(i+1) : '',\n        stackStyle: { width: '64%', maxWidth: '20px', height: (total/maxY*100) + '%', display: 'flex', flexDirection: 'column', borderRadius: '3px 3px 0 0', overflow: 'hidden' },\n        savedStyle: { height: (s/total*100) + '%', background: '#0e9e6e' },\n        actualStyle: { height: (a/total*100) + '%', background: '#d6cfc1' },\n      };\n    });\n\n    // ── levers ──\n    const leverActive = this.leverDefs.filter(l => l.active && l.amount > 0).length;\n    const levers = this.leverDefs.map(l => {\n      const share = grossSaved ? l.amount / grossSaved * 100 : 0;\n      const idle = !l.active;\n      const zero = l.amount === 0;\n      return {\n        name: l.name,\n        amount: fmt(l.amount),\n        share: Math.round(share) + '%',\n        statusLabel: l.active ? 'Active' : 'Off',\n        nameColor: zero ? '#a8a29e' : '#1a1714',\n        amountColor: zero ? '#c0bcb6' : '#1a1714',\n        barStyle: { width: share + '%', height: '100%', background: zero ? '#d8d2c8' : '#0e9e6e', borderRadius: '3px' },\n        pillStyle: {\n          display: 'inline-flex', alignItems: 'center', padding: '3px 8px', borderRadius: '100px',\n          font: \"600 9.5px/1 'DM Sans', sans-serif\", whiteSpace: 'nowrap', flex: 'none',\n          color: idle ? '#9c7a2e' : '#0e9e6e',\n          background: idle ? '#f6edd8' : 'rgba(14,158,110,0.1)',\n        },\n      };\n    });\n\n    // ── lever descriptions ──\n    const leverDocs = [\n      { num: '01', title: 'Smart routing', body: 'Send each request to the most cost-effective model that still meets your quality bar, automatically.' },\n      { num: '02', title: 'Semantic cache', body: 'Stop paying twice for the same answer. Repeated and near-identical requests resolve from cache.' },\n      { num: '03', title: 'Token trim', body: 'Cut wasted tokens from prompts and context without changing what the model returns.' },\n      { num: '04', title: 'Model downshift', body: 'Downshift to a lower-cost model where it produces equivalent output, and only where it does.' },\n      { num: '05', title: 'Batching', body: 'Group eligible requests to capture provider efficiencies and lower per-call cost.' },\n    ];\n\n    // ── drivers ──\n    const dtotal = sum(this.driverDefs.map(d => d.spend));\n    const driverItems = this.driverDefs.map((d, i) => {\n      const pct = d.spend / dtotal * 100;\n      const c = d.muted ? this.MUTED : (this.RAMP[i] || this.RAMP[this.RAMP.length-1]);\n      return {\n        name: d.name,\n        spend: fmt(d.spend),\n        pct: pct.toFixed(1) + '%',\n        nameColor: d.muted ? '#a8a29e' : '#1a1714',\n        dotStyle: { width: '9px', height: '9px', borderRadius: '2px', background: c, flex: 'none' },\n        segStyle: { width: pct + '%', height: '100%', background: c },\n      };\n    });\n\n    // ── proof ──\n    const proof = [\n      { title: 'Pricing coverage', tag: 'Catalog-verified', value: '100%', detail: 'Every dollar priced from official provider catalogs.' },\n      { title: 'Spend attribution', tag: 'Tagged', value: '96.7%', detail: 'Share of spend tied to a team or feature.' },\n      { title: 'Holdback test', tag: 'Passing', value: 'Live', detail: 'A traffic slice skips Varsten to prove the delta.' },\n    ];\n\n    // ── problem questions ──\n    const problems = [\n      { num: '01', text: 'Which models, routes, features, and teams are actually driving spend?' },\n      { num: '02', text: 'Where is money wasted on calls a lower-cost model or a cache could handle?' },\n      { num: '03', text: 'If you optimize, how do you guarantee quality and latency don\\u2019t regress?' },\n      { num: '04', text: 'And when the CFO asks \\u201cdid it work?\\u201d What do you point to?' },\n    ];\n\n    // ── solution pillars ──\n    const pillars = [\n      { num: '01', tag: 'Observe', title: 'See where the money goes.', body: 'By model, route, feature, customer, team, provider, and pricing source. No more estimating. The full picture, broken down the way finance actually thinks about cost.' },\n      { num: '02', tag: 'Optimize', title: 'Cut spend, safely.', body: 'Apply savings levers only where your quality and latency guardrails hold. Optimizations that would degrade output simply don\\u2019t fire. You set the limits.' },\n      { num: '03', tag: 'Prove', title: 'Defend it line by line.', body: 'A finance-grade ledger: gross savings, Varsten fee, net savings, and attribution by lever, route, and method. The number you take to your CFO is one you can defend.' },\n    ];\n\n    // ── how it works ──\n    const steps = [\n      { num: '1', title: 'Connect', body: 'Point your AI traffic through Varsten with a drop-in base URL change. Your existing SDKs keep working, with no rewrites.' },\n      { num: '2', title: 'Optimize', body: 'Varsten meters your spend and applies safe levers within the guardrails you set. Quality and latency stay inside your limits, or it doesn\\u2019t happen.' },\n      { num: '3', title: 'Prove', body: 'Watch verified savings accrue in real time, with a ledger built for finance review, not just an engineering dashboard.' },\n    ];\n\n    // ── security ──\n    const security = [\n      { title: 'Fail-open by design', body: 'If Varsten ever has a problem, traffic passes straight through to your providers. Optimization is never a single point of failure for production.' },\n      { title: 'Metadata-only ledger', body: 'We measure cost, not content. Your prompts and outputs are never stored.' },\n      { title: 'Scoped keys', body: 'Access is limited to exactly what\\u2019s needed to meter and optimize, nothing more.' },\n      { title: 'Quality & latency guardrails', body: 'You set the limits. Any optimization that would breach them never fires.' },\n      { title: 'Review-ready', body: 'Prepared for your DPA and security review, so procurement doesn\\u2019t stall the rollout.' },\n    ];\n\n    // ── calculator ──\n    const s = this.state.spend;\n    const cgross = Math.round(s * 0.20);\n    const cfee = Math.round(cgross * 0.25);\n    const ckeep = cgross - cfee;\n    const cannual = ckeep * 12;\n    const pct = (s - 5000) / 95000 * 100;\n\n    return {\n      heroBars,\n      yTicks, bars,\n      avgSpend: fmt(actualSpend / days), avgSaved: fmt(grossSaved / days), effRate: effRate.toFixed(1) + '%',\n      levers, leverActive, leverDocs, grossSaved: fmt(grossSaved),\n      driverItems, driverTotal: fmt(dtotal),\n      feeAmt: fmt(fee), netSaved: fmt(net),\n      proof, problems, pillars, steps, security,\n      spend: s,\n      spendLabel: fmt(s),\n      grossLabel: fmt(cgross) + '/mo',\n      feeLabel: fmt(cfee) + '/mo',\n      keepLabel: fmt(ckeep) + '/mo',\n      annualLabel: fmt(cannual) + '/yr',\n      sliderStyle: { background: 'linear-gradient(to right, #0e9e6e ' + pct + '%, #e3ddd2 ' + pct + '%)' },\n      onSpend: e => this.setState({ spend: Number(e.target.value) }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
